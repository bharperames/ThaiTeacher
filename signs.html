<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bangkok Signs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Layout: one study column. The card front is a sign plate in the colors
     that kind of sign uses in Bangkok; the back explains it letter by letter. */
  :root {
    --bg: #f6f3ee;
    --surface: #ffffff;
    --text: #1f1d1a;
    --muted: #5f5a52;
    --border: #e2dcd2;
    --accent: #b5452b;
    --again: #c0392b;
    --hard: #b9770e;
    --good: #1e8449;
    --easy: #2471a3;
    --shadow: 0 6px 24px rgba(60, 40, 20, 0.08);
    --thai: Sarabun, Thonburi, "Leelawadee UI", sans-serif;
    /* Sign plates are physical objects: same colors in both themes. */
    --plate-transit: #1d5aa6;
    --plate-exit: #17804a;
    --plate-warn: #c8201e;
    --plate-place: #7a4a26;
    --plate-room: #33363b;
    --plate-shop: #f2c230;
    --plate-ink: #ffffff;
    --plate-ink-dark: #1a1a1a;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17161a; --surface: #222127; --text: #f1eee8; --muted: #b4aea4; --border: #3a3840;
      --accent: #f08a68; --again: #ef6f60; --hard: #f0b35a; --good: #5fcf8c; --easy: #6fb3e8;
      --shadow: 0 6px 24px rgba(0, 0, 0, 0.4);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #17161a; --surface: #222127; --text: #f1eee8; --muted: #b4aea4; --border: #3a3840;
    --accent: #f08a68; --again: #ef6f60; --hard: #f0b35a; --good: #5fcf8c; --easy: #6fb3e8;
    --shadow: 0 6px 24px rgba(0, 0, 0, 0.4);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 Figtree, system-ui, sans-serif; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 24px 16px 48px; }
  .nav { font-size: 0.9rem; margin-bottom: 16px; }
  a { color: var(--accent); }
  h1 { font-size: 1.4rem; margin: 0; }
  .lead { color: var(--muted); margin: 4px 0 0; }
  .th { font-family: var(--thai); }
  .stats { display: flex; gap: 16px; margin: 16px 0; font-size: 0.95rem; color: var(--muted); }
  .stats b { color: var(--text); font-size: 1.1rem; }
  .stat-new b { color: var(--easy); }
  .stat-learn b { color: var(--again); }
  .stat-due b { color: var(--good); }

  button { font: inherit; cursor: pointer; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); color: var(--text); padding: 8px 14px; }
  button:hover { border-color: var(--muted); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 18px; box-shadow: var(--shadow);
    min-height: 220px; padding: 24px 20px; display: flex; flex-direction: column; align-items: center;
    justify-content: center; text-align: center; gap: 12px; cursor: pointer; user-select: none;
  }
  .tag { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }

  .plate {
    font-family: var(--thai); font-weight: 800; font-size: 2.6rem; line-height: 1.35;
    padding: 14px 28px; border-radius: 8px; color: var(--plate-ink);
    box-shadow: inset 0 0 0 3px rgba(255, 255, 255, 0.85), 0 2px 6px rgba(0, 0, 0, 0.2);
    max-width: 100%; overflow-wrap: anywhere;
  }
  .plate.transit { background: var(--plate-transit); }
  .plate.exit { background: var(--plate-exit); }
  .plate.place { background: var(--plate-place); }
  .plate.room { background: var(--plate-room); }
  .plate.shop { background: var(--plate-shop); color: var(--plate-ink-dark); box-shadow: inset 0 0 0 3px var(--plate-ink-dark), 0 2px 6px rgba(0, 0, 0, 0.2); }
  .plate.warn { background: #ffffff; color: var(--plate-warn); box-shadow: inset 0 0 0 5px var(--plate-warn), 0 2px 6px rgba(0, 0, 0, 0.2); }

  .english { font-size: 1.5rem; font-weight: 600; }
  .roman { font-size: 1.1rem; color: var(--accent); font-weight: 500; }
  .note { font-size: 0.92rem; color: var(--muted); max-width: 42ch; }
  hr.div { width: 60%; border: 0; border-top: 1px dashed var(--border); margin: 4px 0; }
  .hint { font-size: 0.85rem; color: var(--muted); }

  .parts { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; max-width: 100%; }
  .chip { display: flex; flex-direction: column; align-items: center; min-width: 3.6em; padding: 4px 6px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); }
  .chip .g { font-family: var(--thai); font-size: 1.6rem; line-height: 1.5; }
  .chip small { font-size: 0.68rem; color: var(--muted); line-height: 1.25; max-width: 8em; }
  .chip.vowel .g { color: var(--easy); }
  .chip.tone .g { color: var(--accent); }
  .chip.digit .g { color: var(--good); }
  .legend { font-size: 0.78rem; color: var(--muted); }
  .legend b.v { color: var(--easy); } .legend b.t { color: var(--accent); } .legend b.d { color: var(--good); }

  .ratings { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 16px; }
  .ratings button { display: flex; flex-direction: column; align-items: center; padding: 10px 4px; font-weight: 600; }
  .ratings small { font-weight: 400; color: var(--muted); font-size: 0.8rem; }
  .r-again { color: var(--again); } .r-hard { color: var(--hard); } .r-good { color: var(--good); } .r-easy { color: var(--easy); }
  .reveal { width: 100%; max-width: 360px; margin-top: 12px; padding: 14px; font-weight: 600; background: var(--text); color: var(--bg); border-color: var(--text); }
  .speak { font-size: 0.9rem; padding: 6px 12px; }

  /* Flip card: both faces share one grid cell, so the card is as tall as its
     taller face. The back starts turned away and shows when the card flips. */
  .flip { perspective: 1400px; animation: deal 0.25s ease-out; }
  .flip-inner { display: grid; transform-style: preserve-3d; transition: transform 0.6s cubic-bezier(0.3, 0.7, 0.2, 1); }
  .flip.flipped .flip-inner { transform: rotateY(180deg); }
  .face {
    grid-area: 1 / 1; backface-visibility: hidden; -webkit-backface-visibility: hidden;
    background: var(--surface); border: 1px solid var(--border); border-radius: 18px; box-shadow: var(--shadow);
    min-height: 320px; padding: 24px 20px; display: flex; flex-direction: column; align-items: center;
    justify-content: center; text-align: center; gap: 10px; min-width: 0;
  }
  .face { cursor: pointer; }
  .face.back { transform: rotateY(180deg); }
  .face .ratings { width: 100%; margin-top: 8px; }
  @keyframes deal { from { opacity: 0; transform: translateY(8px); } }
  @media (prefers-reduced-motion: reduce) { .flip { animation: none; } .flip-inner { transition: none; } }
  .prompt .plate { font-size: 1.4rem; padding: 6px 16px; }
  .done { cursor: default; }
  .done p { color: var(--muted); }
  .done .actions { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }

  details { margin-top: 32px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 12px 16px; }
  summary { cursor: pointer; font-weight: 600; }
  .tablewrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 0.9rem; }
  td, th { padding: 6px 4px; text-align: left; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; }
  tr.cat td { font-weight: 600; color: var(--muted); padding-top: 14px; }
  td.th { font-size: 1.15rem; }
  .pill { font-size: 0.75rem; padding: 2px 8px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
  .p-new { color: var(--easy); } .p-learning { color: var(--again); } .p-review { color: var(--good); }
  .foot { margin-top: 16px; font-size: 0.85rem; color: var(--muted); }
  .foot button { font-size: 0.85rem; padding: 4px 10px; }
  kbd { font: 0.8rem ui-monospace, monospace; border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; }
</style>
</head>
<body>
<div class="wrap">
  <nav class="nav"><a href="index.html">← Home</a> · <a href="phrases.html">Phrases</a> · <a href="market.html">Market</a> · <a href="alphabet.html">Letters</a></nav>
  <h1>Bangkok Signs</h1>
  <p class="lead">Signs you'll pass every day, for reading rather than saying. Read the sign, then check
    the meaning and how it breaks down into letters.</p>

  <div class="stats">
    <span class="stat-new">New <b id="s-new">0</b></span>
    <span class="stat-learn">Learning <b id="s-learn">0</b></span>
    <span class="stat-due">Due <b id="s-due">0</b></span>
  </div>

  <main id="study"></main>

  <details>
    <summary>All signs &amp; progress</summary>
    <div class="tablewrap">
      <table>
        <thead><tr><th>Sign</th><th>Meaning</th><th>Status</th><th>Next</th></tr></thead>
        <tbody id="table"></tbody>
      </table>
    </div>
    <div class="foot"><p><button id="reset">Reset sign progress</button></p></div>
  </details>

  <p class="foot">Keys: <kbd>Space</kbd> reveal · <kbd>1</kbd>–<kbd>4</kbd> rate · <kbd>S</kbd> speak</p>
</div>

<script src="srs.js"></script>
<script src="thai-data.js"></script>
<script>
// cat sets the plate color: Bangkok uses blue for transit and roads, green for
// exits, red for warnings, brown for temples and landmarks.
const CATS = {
  transit: "Getting around",
  exit: "Ways out",
  room: "Doors, floors and toilets",
  warn: "Warnings",
  place: "Places",
  shop: "Shops and food",
};
const SIGNS = [
  { th: "ทางออก", ro: "thaang àwk", en: "Exit", cat: "exit" },
  { th: "ทางเข้า", ro: "thaang khâo", en: "Entrance", cat: "exit" },
  { th: "ทางหนีไฟ", ro: "thaang nǐi fai", en: "Fire exit", cat: "exit", note: "Literally “way to flee fire”." },
  { th: "สถานี", ro: "sà-thǎa-nii", en: "Station", cat: "transit" },
  { th: "รถไฟฟ้า", ro: "rót fai fáa", en: "Skytrain (BTS)", cat: "transit", note: "Literally “electric train”. Also used for other elevated lines." },
  { th: "รถไฟใต้ดิน", ro: "rót fai dtâi din", en: "Subway (MRT)", cat: "transit", note: "Literally “train under the ground”." },
  { th: "ป้ายรถเมล์", ro: "bpâai rót-mee", en: "Bus stop", cat: "transit" },
  { th: "ท่าเรือ", ro: "thâa ruea", en: "Pier", cat: "transit", note: "For the Chao Phraya river boats and canal boats." },
  { th: "ขาออก", ro: "khǎa àwk", en: "Departures", cat: "transit" },
  { th: "ขาเข้า", ro: "khǎa khâo", en: "Arrivals", cat: "transit" },
  { th: "ถนน", ro: "thà-nǒn", en: "Road", cat: "transit" },
  { th: "ซอย ๑๑", ro: "sawy sìp-èt", en: "Soi 11 (side street 11)", cat: "transit", note: "Side streets off a main road are numbered. ๑๑ is 11 in Thai digits." },
  { th: "รถว่าง", ro: "rót wâang", en: "Taxi available", cat: "transit", note: "Shown in red on a taxi's windshield when it's free. ว่าง means empty or free." },
  { th: "ห้องน้ำ", ro: "hâwng-náam", en: "Toilet / bathroom", cat: "room" },
  { th: "สุขา", ro: "sù-khǎa", en: "Restroom", cat: "room", note: "A more formal word for toilet, common on public signs." },
  { th: "ชาย", ro: "chaai", en: "Men", cat: "room" },
  { th: "หญิง", ro: "yǐng", en: "Women", cat: "room" },
  { th: "ดึง", ro: "dueng", en: "Pull", cat: "room" },
  { th: "ผลัก", ro: "phlàk", en: "Push", cat: "room" },
  { th: "เปิด", ro: "bpèrt", en: "Open", cat: "room" },
  { th: "ปิด", ro: "bpìt", en: "Closed", cat: "room", note: "Only one letter apart from เปิด (open), so read carefully." },
  { th: "ชั้น ๒", ro: "chán sǎawng", en: "2nd floor", cat: "room", note: "Floors are counted from the ground, which is ชั้น ๑." },
  { th: "บันได", ro: "ban-dai", en: "Stairs", cat: "room" },
  { th: "ห้ามเข้า", ro: "hâam khâo", en: "No entry", cat: "warn", note: "ห้าม (forbidden) starts most prohibition signs." },
  { th: "ห้ามสูบบุหรี่", ro: "hâam sùup bù-rìi", en: "No smoking", cat: "warn" },
  { th: "ห้ามจอด", ro: "hâam jàwt", en: "No parking", cat: "warn" },
  { th: "ระวัง", ro: "rá-wang", en: "Caution / watch out", cat: "warn" },
  { th: "อันตราย", ro: "an-dtà-raai", en: "Danger", cat: "warn" },
  { th: "หยุด", ro: "yùt", en: "Stop", cat: "warn" },
  { th: "ส่วนบุคคล", ro: "sùan bùk-khon", en: "Private", cat: "warn" },
  { th: "ถอดรองเท้า", ro: "thàawt rawng-tháao", en: "Remove your shoes", cat: "warn", note: "At temples, homes, some shops and massage places." },
  { th: "โรงพยาบาล", ro: "roong phá-yaa-baan", en: "Hospital", cat: "place" },
  { th: "ร้านขายยา", ro: "ráan khǎai yaa", en: "Pharmacy", cat: "place", note: "Literally “shop that sells medicine”." },
  { th: "ตำรวจ", ro: "dtam-rùat", en: "Police", cat: "place" },
  { th: "วัด", ro: "wát", en: "Temple", cat: "place" },
  { th: "ตลาด", ro: "dtà-làat", en: "Market", cat: "place" },
  { th: "ธนาคาร", ro: "thá-naa-khaan", en: "Bank", cat: "place" },
  { th: "ร้านอาหาร", ro: "ráan aa-hǎan", en: "Restaurant", cat: "shop" },
  { th: "ราคา", ro: "raa-khaa", en: "Price", cat: "shop" },
  { th: "๕๐ บาท", ro: "hâa-sìp bàat", en: "50 baht", cat: "shop", note: "๕ is 5 and ๐ is 0. Street stalls often price in Thai digits." },
  { th: "ลดราคา", ro: "lót raa-khaa", en: "Sale / discount", cat: "shop", note: "Literally “reduce price”." },
  { th: "เงินสด", ro: "ngern sòt", en: "Cash", cat: "shop" },
  { th: "ก๋วยเตี๋ยว", ro: "gǔay-dtǐao", en: "Noodle soup", cat: "shop" },
  { th: "ข้าวผัด", ro: "khâao phàt", en: "Fried rice", cat: "shop" },
  { th: "น้ำดื่ม", ro: "náam dùuem", en: "Drinking water", cat: "shop" },
];

const deck = new SRS.Deck("thai-signs-v1", SIGNS.map(s => s.th));
const { fmtInterval, schedule, status } = SRS;
let current = null;
let revealed = false;
let timer = null;

const $ = id => document.getElementById(id);
function esc(s) {
  return String(s).replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
}

// One chip per written character, labeled from the shared letter tables.
function chips(text) {
  return Array.from(text).filter(ch => ch.trim()).map(ch => {
    let kind = "", label = "";
    if (LETTERS[ch]) label = LETTERS[ch].name;
    else if (DIGITS[ch]) { kind = "digit"; label = `${DIGITS[ch].n} · ${DIGITS[ch].name}`; }
    else if (MARKS[ch]) { kind = MARKS[ch].tone ? "tone" : "vowel"; label = MARKS[ch].sound; }
    return `<span class="chip ${kind}"><span class="g">${esc(showChar(ch))}</span><small>${esc(label)}</small></span>`;
  }).join("");
}

function renderStats() {
  const n = deck.counts();
  $("s-new").textContent = n.new;
  $("s-learn").textContent = n.learning;
  $("s-due").textContent = n.due;
}

function renderTable() {
  const now = Date.now();
  $("table").innerHTML = Object.entries(CATS).map(([cat, title]) =>
    `<tr class="cat"><td colspan="4">${esc(title)}</td></tr>` +
    SIGNS.map((s, i) => [s, i]).filter(([s]) => s.cat === cat).map(([s, i]) => {
      const c = deck.card(i), st = status(c);
      const next = c.due === null ? "—" : c.due <= now ? "now" : fmtInterval((c.due - now) / 60000);
      return `<tr><td class="th">${esc(s.th)}</td><td>${esc(s.en)}<br><small>${esc(s.ro)}</small></td>
        <td><span class="pill p-${st}">${st}</span></td><td>${next}</td></tr>`;
    }).join("")).join("");
}

function renderCard() {
  const s = SIGNS[current], c = deck.card(current);
  const label = (c.due === null ? "New sign" : status(c) === "learning" ? "Learning" : "Review") + ` · ${esc(CATS[s.cat])}`;
  const plate = `<div class="plate ${s.cat}" lang="th">${esc(s.th)}</div>`;
  const opts = [["again", "Forgot", 1], ["hard", "Shaky", 2], ["good", "Got it", 3], ["easy", "Nailed it", 4]];
  const ratings = opts.map(([k, name, n]) =>
    `<button class="r-${k}" data-rate="${k}" title="Press ${n}">${name}<small>${fmtInterval(schedule(c, k).interval)}</small></button>`).join("");

  $("study").innerHTML = `<div class="flip${revealed ? " flipped" : ""}" id="card">
    <div class="flip-inner">
      <div class="face front" id="front" ${revealed ? "inert" : ""}>
        <div class="tag">${label}</div>${plate}
        <div class="hint">What does it say?</div>
        <button class="reveal" id="reveal" type="button">Reveal answer</button>
      </div>
      <div class="face back" id="back" aria-live="polite" ${revealed ? "" : "inert"}>
        <div class="prompt">${plate}</div>
        <div class="english">${esc(s.en)}</div><div class="roman">${esc(s.ro)}</div>
        ${s.note ? `<div class="note">${esc(s.note)}</div>` : ""}
        <hr class="div"><div class="parts" lang="th">${chips(s.th)}</div>
        <div class="legend">consonants · <b class="v">vowels</b> · <b class="t">tone marks</b> · <b class="d">digits</b></div>
        <button class="speak" id="speak" type="button">🔊 Listen</button>
        <div class="ratings">${ratings}</div>
        <div class="hint">Tap the card or press Space to flip it back</div>
      </div>
    </div></div>`;
  $("front").onclick = () => flip(true);
  $("back").onclick = e => { if (!e.target.closest("button")) flip(false); };
  $("speak").onclick = speak;
  document.querySelectorAll("[data-rate]").forEach(b => b.onclick = () => rate(b.dataset.rate));
}

function renderDone() {
  const { unseen, nextDue } = deck.counts();
  const wait = nextDue !== null ? Math.max(0, nextDue - Date.now()) : null;
  let msg = "You're all caught up for now.";
  if (wait !== null) msg += ` Next review in <b>${fmtInterval(Math.max(1, wait / 60000))}</b>.`;
  $("study").innerHTML = `<div class="card done">
    <div class="plate exit" lang="th">เก่งมาก</div><div>kèng mâak, great job!</div>
    <p>${msg}</p>
    <div class="actions">
      ${unseen ? `<button id="more">Learn ${Math.min(5, unseen)} more new</button>` : ""}
      ${wait !== null ? `<button id="ahead">Review ahead</button>` : ""}
    </div></div>`;
  if ($("more")) $("more").onclick = () => { deck.extraNew += 5; advance(); };
  if ($("ahead")) $("ahead").onclick = () => advance(true);
  if (wait !== null && wait < 30 * 60000) timer = setTimeout(() => advance(), wait + 500);
}

function render() {
  clearTimeout(timer);
  renderStats();
  renderTable();
  if (current === null) renderDone(); else renderCard();
}

function advance(ahead = false) {
  current = deck.next(ahead);
  revealed = false;
  render();
}
// Turn the card over, either way, so the answer can be peeked at and hidden.
function flip(show = !revealed) {
  if (current === null) return;
  revealed = show;
  $("card").classList.toggle("flipped", show);
  $("front").inert = show;
  $("back").inert = !show;
}
function rate(r) {
  if (current === null || !revealed) return;
  deck.rate(current, r);
  advance();
}

let thaiVoice = null;
function pickVoice() {
  thaiVoice = speechSynthesis.getVoices().find(v => v.lang && v.lang.toLowerCase().startsWith("th")) || null;
}
if ("speechSynthesis" in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak() {
  if (current === null || !revealed || !("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(SIGNS[current].th);
  u.lang = "th-TH";
  if (thaiVoice) u.voice = thaiVoice;
  u.rate = 0.8;
  speechSynthesis.speak(u);
}

// Two-tap confirmation (no browser dialogs).
let resetArmed = null;
$("reset").onclick = () => {
  const btn = $("reset");
  if (!resetArmed) {
    btn.textContent = "Tap again to erase sign progress";
    resetArmed = setTimeout(() => { resetArmed = null; btn.textContent = "Reset sign progress"; }, 4000);
    return;
  }
  clearTimeout(resetArmed); resetArmed = null;
  btn.textContent = "Reset sign progress";
  deck.reset();
  advance();
};

document.addEventListener("keydown", e => {
  if (e.target.closest && e.target.closest("button") && (e.key === " " || e.key === "Enter")) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === " " || e.key === "Enter") {
    if (current !== null) { e.preventDefault(); flip(); }
  } else if (revealed && "1234".includes(e.key)) {
    rate(["again", "hard", "good", "easy"][+e.key - 1]);
  } else if (e.key.toLowerCase() === "s") {
    speak();
  }
});

setInterval(() => { renderStats(); renderTable(); }, 30000);
current = deck.next();
render();
</script>
