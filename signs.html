<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bangkok Signs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&family=Figtree:wght@400;500;600&family=Overpass:wght@700;800&family=Itim&display=swap" rel="stylesheet">
<style>
  /* Layout: one study column. The card shows the sign as it looks in Bangkok,
     its English covered until the answer is revealed. */
  :root {
    --bg: #f6f3ee;
    --surface: #ffffff;
    --text: #1f1d1a;
    --muted: #5f5a52;
    --border: #e2dcd2;
    --accent: #b5452b;
    --again: #c0392b;
    --hard: #b9770e;
    --good: #1e8449;
    --easy: #2471a3;
    --shadow: 0 6px 24px rgba(60, 40, 20, 0.08);
    --thai: Sarabun, Thonburi, "Leelawadee UI", sans-serif;
    /* Signs are physical objects: the same colors in both themes. */
    --sign-green: #00843d;
    --sign-navy: #0e3a6b;
    --sign-blue: #1f5fae;
    --sign-brown: #6e4127;
    --sign-charcoal: #2b2d31;
    --sign-red: #c8102e;
    --sign-orange: #d9681e;
    --sign-ink: #141414;
    --sign-paper: #ffffff;
    --sign-board: #f6ecd2;
    --sign-latin: Overpass, "Helvetica Neue", Arial, sans-serif;
    --sign-hand: Itim, "Comic Sans MS", var(--thai);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17161a; --surface: #222127; --text: #f1eee8; --muted: #b4aea4; --border: #3a3840;
      --accent: #f08a68; --again: #ef6f60; --hard: #f0b35a; --good: #5fcf8c; --easy: #6fb3e8;
      --shadow: 0 6px 24px rgba(0, 0, 0, 0.4);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #17161a; --surface: #222127; --text: #f1eee8; --muted: #b4aea4; --border: #3a3840;
    --accent: #f08a68; --again: #ef6f60; --hard: #f0b35a; --good: #5fcf8c; --easy: #6fb3e8;
    --shadow: 0 6px 24px rgba(0, 0, 0, 0.4);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 Figtree, system-ui, sans-serif; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 24px 16px 48px; }
  .nav { font-size: 0.9rem; margin-bottom: 16px; }
  a { color: var(--accent); }
  h1 { font-size: 1.4rem; margin: 0; }
  .lead { color: var(--muted); margin: 4px 0 0; }
  .th { font-family: var(--thai); }
  .stats { display: flex; gap: 16px; margin: 16px 0; font-size: 0.95rem; color: var(--muted); }
  .stats b { color: var(--text); font-size: 1.1rem; }
  .stat-new b { color: var(--easy); }
  .stat-learn b { color: var(--again); }
  .stat-due b { color: var(--good); }

  button { font: inherit; cursor: pointer; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); color: var(--text); padding: 8px 14px; }
  button:hover { border-color: var(--muted); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 18px; box-shadow: var(--shadow);
    min-height: 220px; padding: 24px 20px; display: flex; flex-direction: column; align-items: center;
    justify-content: center; text-align: center; gap: 12px; cursor: pointer; user-select: none;
  }
  .tag { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }

  /* Signs */
  .sign-stage { display: flex; justify-content: center; max-width: 100%; padding: 6px 0; }
  .sg { display: inline-flex; align-items: center; gap: 14px; padding: 12px 22px; border-radius: 6px; max-width: 100%;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.22); text-align: left; }
  .s-words-col { display: flex; flex-direction: column; align-items: flex-start; gap: 5px; min-width: 0; }
  .s-thai { font-family: var(--thai); font-weight: 700; font-size: 2.2rem; line-height: 1.25; }
  .s-thai.long { font-size: 1.85rem; }
  .s-thai.longer { font-size: 1.5rem; }
  .sg-en { font-family: var(--sign-latin); font-weight: 700; font-size: 1.05rem; letter-spacing: 0.02em; line-height: 1.2;
          border-radius: 3px; transition: color 0.3s, background-color 0.3s; }
  /* Until the answer is revealed, the English on the sign is covered. */
  .study-card:not(.revealed) .sg-en { color: transparent !important; background: currentColor; background: rgba(128, 128, 128, 0.45); }
  .tgt { text-decoration: underline 2px; text-underline-offset: 5px; }
  .sg .pic { width: 3rem; height: 3rem; flex: none; }
  .sg .pic.wide { width: 5.4rem; }
  .sg-panel { color: #fff; box-shadow: inset 0 0 0 3px rgba(255, 255, 255, 0.85), 0 2px 6px rgba(0, 0, 0, 0.22); }
  .t-green { background: var(--sign-green); } .t-navy { background: var(--sign-navy); } .t-blue { background: var(--sign-blue); }
  .t-brown { background: var(--sign-brown); } .t-charcoal { background: var(--sign-charcoal); }
  .t-red { background: var(--sign-red); } .t-orange { background: var(--sign-orange); }
  .t-white { background: var(--sign-paper); color: var(--sign-ink); box-shadow: inset 0 0 0 2px var(--sign-ink), 0 2px 6px rgba(0, 0, 0, 0.22); }
  .sg-street { background: var(--sign-blue); color: #fff; border-radius: 8px; padding: 10px 26px;
               box-shadow: inset 0 0 0 3px #fff, 0 2px 6px rgba(0, 0, 0, 0.22); }
  .sg-street .s-words-col { align-items: center; }
  .sg-sticker { background: var(--sign-paper); color: var(--sign-ink); border-radius: 10px; padding: 8px 18px;
                box-shadow: inset 0 0 0 2px var(--sign-red), 0 1px 4px rgba(0, 0, 0, 0.2); }
  .sg-sticker .s-thai { font-size: 1.7rem; color: var(--sign-red); }
  .sg-sticker .pic { color: var(--sign-blue); width: 2.4rem; height: 2.4rem; }
  .sg-post { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .sg-disc { width: 7.5rem; height: 7.5rem; filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.25)); }
  .sg-plate { background: var(--sign-paper); color: var(--sign-ink); padding: 4px 16px; border-radius: 4px;
              box-shadow: inset 0 0 0 2px var(--sign-ink), 0 2px 4px rgba(0, 0, 0, 0.2); }
  .sg-plate .s-words-col { align-items: center; }
  .sg-plate .s-thai { font-size: 1.6rem; }
  .sg-stop { position: relative; width: 8.5rem; height: 8.5rem; filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.25)); }
  .sg-stop svg { width: 100%; height: 100%; display: block; }
  .sg-stop .s-thai { position: absolute; inset: 0; display: grid; place-items: center; color: #fff; font-size: 2.3rem; font-weight: 800; }
  .sg-danger { background: var(--sign-paper); padding: 8px; box-shadow: inset 0 0 0 3px var(--sign-ink), 0 2px 6px rgba(0, 0, 0, 0.22); }
  .sg-danger-band { background: var(--sign-ink); padding: 8px 14px; border-radius: 3px; }
  .sg-danger-band .s-words-col { background: var(--sign-red); color: #fff; padding: 2px 26px; border-radius: 999px; align-items: center; }
  .sg-taxi { background: linear-gradient(160deg, #3a4048, #0d0f12); padding: 22px 34px; border-radius: 14px 14px 6px 6px; }
  .sg-led { font-family: var(--thai); font-weight: 800; font-size: 2.6rem; line-height: 1.2; padding: 2px 16px; border-radius: 4px;
            background: #050505 radial-gradient(circle, rgba(255, 255, 255, 0.05) 1px, transparent 1.5px) 0 0 / 4px 4px; }
  .sg-led.t-red { color: #ff4b3e; text-shadow: 0 0 6px #ff2a1a, 0 0 16px rgba(255, 40, 20, 0.8); }
  .sg-led.t-green { color: #47ff7a; text-shadow: 0 0 6px #1aff5a, 0 0 16px rgba(20, 255, 90, 0.7); }
  .sg-hang-wrap { display: flex; flex-direction: column; align-items: center; }
  .sg-string { width: 80px; height: 28px; margin-bottom: -4px; }
  .sg-hang { background: var(--sign-board); padding: 10px 26px; border-radius: 8px; box-shadow: inset 0 0 0 3px #7a5a35, 0 3px 6px rgba(0, 0, 0, 0.25); }
  .sg-hang .s-words-col { align-items: center; }
  .sg-hang.t-open { color: var(--sign-green); background: var(--sign-board); }
  .sg-hang.t-closed { color: var(--sign-red); background: var(--sign-board); }
  .sg-hand { background: var(--sign-board); color: #b3261e; padding: 10px 26px; border-radius: 3px; transform: rotate(-1.5deg);
             box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25); }
  .sg-hand .s-thai { font-family: var(--sign-hand); font-weight: 400; font-size: 2.6rem; }
  .prompt-note { font-size: 0.85rem; color: var(--muted); }

  .english { font-size: 1.5rem; font-weight: 600; }
  .roman { font-size: 1.1rem; color: var(--accent); font-weight: 500; }
  .note { font-size: 0.92rem; color: var(--muted); max-width: 42ch; }
  hr.div { width: 60%; border: 0; border-top: 1px dashed var(--border); margin: 4px 0; }
  .hint { font-size: 0.85rem; color: var(--muted); }

  .parts { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; max-width: 100%; }
  .chip { display: flex; flex-direction: column; align-items: center; min-width: 3.6em; padding: 4px 6px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); }
  .chip .g { font-family: var(--thai); font-size: 1.6rem; line-height: 1.5; }
  .chip small { font-size: 0.68rem; color: var(--muted); line-height: 1.25; max-width: 8em; }
  .chip.vowel .g { color: var(--easy); }
  .chip.tone .g { color: var(--accent); }
  .chip.digit .g { color: var(--good); }
  .legend { font-size: 0.78rem; color: var(--muted); }
  .legend b.v { color: var(--easy); } .legend b.t { color: var(--accent); } .legend b.d { color: var(--good); }

  .ratings { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 16px; }
  .ratings button { display: flex; flex-direction: column; align-items: center; padding: 10px 4px; font-weight: 600; }
  .ratings small { font-weight: 400; color: var(--muted); font-size: 0.8rem; }
  .r-again { color: var(--again); } .r-hard { color: var(--hard); } .r-good { color: var(--good); } .r-easy { color: var(--easy); }
  .speak { font-size: 0.9rem; padding: 6px 12px; }
  .listen-row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .sentence { background: var(--bg); border-radius: 12px; padding: 10px 14px; max-width: 100%; display: flex; flex-direction: column; gap: 6px; }
  .sentence[hidden] { display: none; }
  .s-words { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px 4px; }
  .s-w { display: flex; flex-direction: column; align-items: center; padding: 2px 5px; border-radius: 6px; }
  .s-w .s-th { font-family: Sarabun, Thonburi, "Leelawadee UI", sans-serif; font-size: 1.25rem; line-height: 1.4; }
  .s-w .s-ro { color: var(--accent); font-size: 0.78rem; }
  .s-w.s-linked .s-th, .s-link { text-decoration: underline dotted var(--muted); text-underline-offset: 4px; }
  .s-en { color: var(--text); font-size: 0.95rem; }
  .s-link { border-radius: 4px; padding: 0 1px; }
  .s-w.hl, .s-link.hl { background: color-mix(in srgb, var(--accent) 24%, transparent); }

  /* The answer sits under a cover. Cover and answer share one grid cell, so
     the cover is exactly the answer's size; tapping it flips it over. */
  .study-card { cursor: default; animation: deal 0.25s ease-out; }
  .flip { width: 100%; perspective: 1400px; }
  .flip-inner { display: grid; transform-style: preserve-3d; transition: transform 0.55s cubic-bezier(0.3, 0.7, 0.2, 1); }
  .flip.flipped .flip-inner { transform: rotateY(180deg); }
  .face {
    grid-area: 1 / 1; backface-visibility: hidden; -webkit-backface-visibility: hidden;
    min-height: 120px; border-radius: 14px; padding: 14px; min-width: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 8px;
  }
  .face.back { transform: rotateY(180deg); cursor: pointer; }
  /* A face turned away still sits under the pointer; let taps pass through it. */
  .flip.flipped .face.front, .flip:not(.flipped) .face.back { pointer-events: none; }
  .cover {
    font: inherit; color: var(--text); cursor: pointer; border: 1px dashed var(--border);
    background: repeating-linear-gradient(135deg, var(--bg) 0 10px, var(--surface) 10px 20px);
  }
  .cover:hover { border-color: var(--muted); }
  .cover-label { background: var(--text); color: var(--bg); font-weight: 600; padding: 10px 24px; border-radius: 999px; }
  .ratings { width: 100%; visibility: hidden; }
  .ratings.shown { visibility: visible; }
  @keyframes deal { from { opacity: 0; transform: translateY(8px); } }
  @media (prefers-reduced-motion: reduce) { .study-card { animation: none; } .flip-inner { transition: none; } }
  .done { cursor: default; }
  .done p { color: var(--muted); }
  .done .actions { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }

  details { margin-top: 32px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 12px 16px; }
  summary { cursor: pointer; font-weight: 600; }
  .tablewrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 0.9rem; }
  td, th { padding: 6px 4px; text-align: left; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; }
  tr.cat td { font-weight: 600; color: var(--muted); padding-top: 14px; }
  td.th { font-size: 1.15rem; }
  .pill { font-size: 0.75rem; padding: 2px 8px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
  .p-new { color: var(--easy); } .p-learning { color: var(--again); } .p-review { color: var(--good); }
  .foot { margin-top: 16px; font-size: 0.85rem; color: var(--muted); }
  .foot button { font-size: 0.85rem; padding: 4px 10px; }
  kbd { font: 0.8rem ui-monospace, monospace; border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; }
</style>
</head>

<div class="wrap">
  <nav class="nav"><a href="index.html">← Home</a> · <a href="phrases.html">Phrases</a> · <a href="market.html">Market</a> · <a href="alphabet.html">Letters</a></nav>
  <h1>Bangkok Signs</h1>
  <p class="lead">Signs you'll pass every day, for reading rather than saying. Read the sign, then check
    the meaning and how it breaks down into letters.</p>

  <div class="stats">
    <span class="stat-new">New <b id="s-new">0</b></span>
    <span class="stat-learn">Learning <b id="s-learn">0</b></span>
    <span class="stat-due">Due <b id="s-due">0</b></span>
  </div>

  <main id="study"></main>

  <details>
    <summary>All signs &amp; progress</summary>
    <div class="tablewrap">
      <table>
        <thead><tr><th>Sign</th><th>Meaning</th><th>Status</th><th>Next</th></tr></thead>
        <tbody id="table"></tbody>
      </table>
    </div>
    <div class="foot"><p><button id="reset">Reset sign progress</button></p></div>
  </details>

  <p class="foot">Keys: <kbd>Space</kbd> reveal · <kbd>1</kbd>–<kbd>4</kbd> rate · <kbd>S</kbd> speak</p>
</div>

<script src="srs.js"></script>
<script src="thai-data.js"></script>
<script src="examples.js"></script>
<script src="sign-art.js"></script>
<script>
// cat groups the signs in the list.
const CATS = {
  transit: "Getting around",
  exit: "Ways out",
  room: "Doors, floors and toilets",
  warn: "Warnings",
  place: "Places",
  shop: "Shops and food",
};
const SIGNS = [
  { th: "ทางออก", ro: "thaang àwk", en: "Exit", cat: "exit" },
  { th: "ทางเข้า", ro: "thaang khâo", en: "Entrance", cat: "exit" },
  { th: "ทางหนีไฟ", ro: "thaang nǐi fai", en: "Fire exit", cat: "exit", note: "Literally “way to flee fire”." },
  { th: "สถานี", ro: "sà-thǎa-nii", en: "Station", cat: "transit" },
  { th: "รถไฟฟ้า", ro: "rót fai fáa", en: "Skytrain (BTS)", cat: "transit", note: "Literally “electric train”. Also used for other elevated lines." },
  { th: "รถไฟใต้ดิน", ro: "rót fai dtâi din", en: "Subway (MRT)", cat: "transit", note: "Literally “train under the ground”." },
  { th: "ป้ายรถเมล์", ro: "bpâai rót-mee", en: "Bus stop", cat: "transit", note: "What people call it. Official stop signs often use the formal ป้ายหยุดรถประจำทาง." },
  { th: "ท่าเรือ", ro: "thâa ruea", en: "Pier", cat: "transit", note: "For the Chao Phraya river boats and canal boats." },
  { th: "ขาออก", ro: "khǎa àwk", en: "Departures", cat: "transit" },
  { th: "ขาเข้า", ro: "khǎa khâo", en: "Arrivals", cat: "transit" },
  { th: "ถนน", ro: "thà-nǒn", en: "Road", cat: "transit" },
  { th: "ซอย ๑๑", ro: "sawy sìp-èt", en: "Soi 11 (side street 11)", cat: "transit", note: "Side streets off a main road are numbered. ๑๑ is 11 in Thai digits, though most street signs use 0–9: ซอย 11." },
  { th: "รถว่าง", ro: "rót wâang", en: "Taxi available", cat: "transit", note: "The light in the windshield just says ว่าง (free). It was red for years; newer registered taxis show green." },
  { th: "ห้องน้ำ", ro: "hâwng-náam", en: "Toilet / bathroom", cat: "room" },
  { th: "สุขา", ro: "sù-khǎa", en: "Restroom", cat: "room", note: "A more formal word for toilet, common on public signs." },
  { th: "ชาย", ro: "chaai", en: "Men", cat: "room" },
  { th: "หญิง", ro: "yǐng", en: "Women", cat: "room" },
  { th: "ดึง", ro: "dueng", en: "Pull", cat: "room" },
  { th: "ผลัก", ro: "phlàk", en: "Push", cat: "room" },
  { th: "เปิด", ro: "bpèrt", en: "Open", cat: "room" },
  { th: "ปิด", ro: "bpìt", en: "Closed", cat: "room", note: "Only one letter apart from เปิด (open), so read carefully." },
  { th: "ชั้น ๒", ro: "chán sǎawng", en: "2nd floor", cat: "room", note: "Floors are counted from the ground, which is ชั้น ๑. Most buildings write the number in 0–9: ชั้น 2." },
  { th: "บันได", ro: "ban-dai", en: "Stairs", cat: "room" },
  { th: "ห้ามเข้า", ro: "hâam khâo", en: "No entry", cat: "warn", note: "ห้าม (forbidden) starts most prohibition signs." },
  { th: "ห้ามสูบบุหรี่", ro: "hâam sùup bù-rìi", en: "No smoking", cat: "warn" },
  { th: "ห้ามจอด", ro: "hâam jàwt", en: "No parking", cat: "warn" },
  { th: "ระวัง", ro: "rá-wang", en: "Caution / watch out", cat: "warn" },
  { th: "อันตราย", ro: "an-dtà-raai", en: "Danger", cat: "warn" },
  { th: "หยุด", ro: "yùt", en: "Stop", cat: "warn" },
  { th: "ส่วนบุคคล", ro: "sùan bùk-khon", en: "Private", cat: "warn" },
  { th: "ถอดรองเท้า", ro: "thàawt rawng-tháao", en: "Remove your shoes", cat: "warn", note: "At temples, homes, some shops and massage places." },
  { th: "โรงพยาบาล", ro: "roong phá-yaa-baan", en: "Hospital", cat: "place" },
  { th: "ร้านขายยา", ro: "ráan khǎai yaa", en: "Pharmacy", cat: "place", note: "Literally “shop that sells medicine”." },
  { th: "ตำรวจ", ro: "dtam-rùat", en: "Police", cat: "place" },
  { th: "วัด", ro: "wát", en: "Temple", cat: "place" },
  { th: "ตลาด", ro: "dtà-làat", en: "Market", cat: "place" },
  { th: "ธนาคาร", ro: "thá-naa-khaan", en: "Bank", cat: "place" },
  { th: "ร้านอาหาร", ro: "ráan aa-hǎan", en: "Restaurant", cat: "shop" },
  { th: "ราคา", ro: "raa-khaa", en: "Price", cat: "shop" },
  { th: "๕๐ บาท", ro: "hâa-sìp bàat", en: "50 baht", cat: "shop", note: "๕ is 5 and ๐ is 0. Street stalls often price in Thai digits." },
  { th: "ลดราคา", ro: "lót raa-khaa", en: "Sale / discount", cat: "shop", note: "Literally “reduce price”." },
  { th: "เงินสด", ro: "ngern sòt", en: "Cash", cat: "shop" },
  { th: "ก๋วยเตี๋ยว", ro: "gǔay-dtǐao", en: "Noodle soup", cat: "shop" },
  { th: "ข้าวผัด", ro: "khâao phàt", en: "Fried rice", cat: "shop" },
  { th: "น้ำดื่ม", ro: "náam dùuem", en: "Drinking water", cat: "shop" },
];

// How each sign looks. text: what the real sign says, when it says more than
// the card's word. en: the English printed on bilingual signs.
const ART = {
  "ทางออก": { t: "green", pic: "run", en: "EXIT" },

  "ตำรวจ": { t: "navy", pic: "badge", text: "ตำรวจท่องเที่ยว", en: "Tourist Police" },
  "วัด": { t: "brown", pic: "temple", text: "วัดอรุณ", en: "Wat Arun" },
  "ตลาด": { t: "orange", text: "ตลาดนัด", en: "Market" },
  "ธนาคาร": { t: "navy", en: "Bank" },
  "ร้านอาหาร": { t: "red", en: "Restaurant" },
  "ราคา": { kind: "hand", text: "ราคา ๔๐ บาท" },
  "๕๐ บาท": { kind: "hand" },
  "ลดราคา": { t: "red", en: "SALE" },
  "เงินสด": { kind: "sticker", text: "รับเฉพาะเงินสด", en: "Cash Only" },
  "ก๋วยเตี๋ยว": { kind: "hand" },
  "ข้าวผัด": { kind: "hand" },
  "น้ำดื่ม": { kind: "sticker", pic: "drop", en: "Drinking Water" },

const deck = new SRS.Deck("thai-signs-v1", SIGNS.map(s => s.th));
const { fmtInterval, schedule, status } = SRS;
let current = null;
let revealed = false;
let timer = null;

const $ = id => document.getElementById(id);
function esc(s) {
  return String(s).replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
}

// One chip per written character, labeled from the shared letter tables.
function chips(text) {
  return Array.from(text).filter(ch => ch.trim()).map(ch => {
    let kind = "", label = "";
    if (LETTERS[ch]) label = LETTERS[ch].name;
    else if (DIGITS[ch]) { kind = "digit"; label = `${DIGITS[ch].n} · ${DIGITS[ch].name}`; }
    else if (MARKS[ch]) { kind = MARKS[ch].tone ? "tone" : "vowel"; label = MARKS[ch].sound; }
    return `<span class="chip ${kind}"><span class="g">${esc(showChar(ch))}</span><small>${esc(label)}</small></span>`;
  }).join("");
}

function renderStats() {
  const n = deck.counts();
  $("s-new").textContent = n.new;
  $("s-learn").textContent = n.learning;
  $("s-due").textContent = n.due;
}

function renderTable() {
  const now = Date.now();
  $("table").innerHTML = Object.entries(CATS).map(([cat, title]) =>
    `<tr class="cat"><td colspan="4">${esc(title)}</td></tr>` +
    SIGNS.map((s, i) => [s, i]).filter(([s]) => s.cat === cat).map(([s, i]) => {
      const c = deck.card(i), st = status(c);
      const next = c.due === null ? "—" : c.due <= now ? "now" : fmtInterval((c.due - now) / 60000);
      return `<tr><td class="th">${esc(s.th)}</td><td>${esc(s.en)}<br><small>${esc(s.ro)}</small></td>
        <td><span class="pill p-${st}">${st}</span></td><td>${next}</td></tr>`;
    }).join("")).join("");
}

function renderCard() {
  const s = SIGNS[current], c = deck.card(current);
  const label = (c.due === null ? "New sign" : status(c) === "learning" ? "Learning" : "Review") + ` · ${esc(CATS[s.cat])}`;
  const plate = `<div class="sign-stage">${renderSign(s, ART[s.th] || { t: "white" })}</div>`;
  const ex = EXAMPLES[s.th] ? parseExample(EXAMPLES[s.th]) : null;
  const opts = [["again", "Forgot", 1], ["hard", "Shaky", 2], ["good", "Got it", 3], ["easy", "Nailed it", 4]];
  const ratings = opts.map(([k, name, n]) =>
    `<button class="r-${k}" data-rate="${k}" title="Press ${n}">${name}<small>${fmtInterval(schedule(c, k).interval)}</small></button>`).join("");

  $("study").innerHTML = `<div class="card study-card${revealed ? " revealed" : ""}">
    <div class="tag">${label}</div>${plate}
    <hr class="div">
    <div class="flip${revealed ? " flipped" : ""}" id="card">
      <div class="flip-inner">
        <button class="face front cover" id="front" type="button" ${revealed ? "inert" : ""}>
          <span class="cover-label">Reveal answer</span><span class="hint">What does it say? Tap, or press Space</span>
        </button>
        <div class="face back" id="back" aria-live="polite" ${revealed ? "" : "inert"}>
          <div class="english">${esc(s.en)}</div><div class="roman">${esc(s.ro)}</div>
          ${s.note ? `<div class="note">${esc(s.note)}</div>` : ""}
          <div class="parts" lang="th">${chips(s.th)}</div>
          <div class="legend">consonants · <b class="v">vowels</b> · <b class="t">tone marks</b> · <b class="d">digits</b></div>
          <div class="listen-row"><button class="speak" id="speak" type="button">🔊 Listen</button>${
            ex ? `<button class="speak" type="button" data-sentence>💬 Hear it in a sentence</button>` : ""}</div>
          ${ex ? sentenceHtml(ex) : ""}
          <div class="hint">Tap here or press Space to cover it again</div>
        </div>
      </div>
    </div>
    <div class="ratings${revealed ? " shown" : ""}" id="ratings" ${revealed ? "" : "inert"}>${ratings}</div>
  </div>`;
  $("front").onclick = () => flip(true);
  $("back").onclick = e => { if (!e.target.closest("button")) flip(false); };
  $("speak").onclick = speak;
  // Play the sentence and show it, with its English, under the button.
  document.querySelectorAll("[data-sentence]").forEach(b => b.onclick = () => {
    speakText(ex.speech);
    b.closest(".listen-row").nextElementSibling.hidden = false;
  });
  wireSentences($("study"));
  document.querySelectorAll("[data-rate]").forEach(b => b.onclick = () => rate(b.dataset.rate));
}

function renderDone() {
  const { unseen, nextDue } = deck.counts();
  const wait = nextDue !== null ? Math.max(0, nextDue - Date.now()) : null;
  let msg = "You're all caught up for now.";
  if (wait !== null) msg += ` Next review in <b>${fmtInterval(Math.max(1, wait / 60000))}</b>.`;
  $("study").innerHTML = `<div class="card done">
    <div class="sign-stage">${renderSign({ th: "เก่งมาก" }, { t: "green", en: "kèng mâak, great job!" })}</div>
    <p>${msg}</p>
    <div class="actions">
      ${unseen ? `<button id="more">Learn ${Math.min(5, unseen)} more new</button>` : ""}
      ${wait !== null ? `<button id="ahead">Review ahead</button>` : ""}
    </div></div>`;
  if ($("more")) $("more").onclick = () => { deck.extraNew += 5; advance(); };
  if ($("ahead")) $("ahead").onclick = () => advance(true);
  if (wait !== null && wait < 30 * 60000) timer = setTimeout(() => advance(), wait + 500);
}

function render() {
  clearTimeout(timer);
  renderStats();
  renderTable();
  if (current === null) renderDone(); else renderCard();
}

function advance(ahead = false) {
  current = deck.next(ahead);
  revealed = false;
  render();
}
// Turn the card over, either way, so the answer can be peeked at and hidden.
function flip(show = !revealed) {
  if (current === null) return;
  revealed = show;
  $("card").classList.toggle("flipped", show);
  $("front").inert = show;
  $("back").inert = !show;
  $("ratings").inert = !show;
  $("ratings").classList.toggle("shown", show);
  $("study").querySelector(".study-card").classList.toggle("revealed", show);
}
function rate(r) {
  if (current === null || !revealed) return;
  deck.rate(current, r);
  advance();
}

let thaiVoice = null;
function pickVoice() {
  thaiVoice = speechSynthesis.getVoices().find(v => v.lang && v.lang.toLowerCase().startsWith("th")) || null;
}
if ("speechSynthesis" in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak() {
  if (current !== null && revealed) speakText(SIGNS[current].th);
}
function speakText(text) {
  if (!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "th-TH";
  if (thaiVoice) u.voice = thaiVoice;
  u.rate = 0.8;
  speechSynthesis.speak(u);
}

// Two-tap confirmation (no browser dialogs).
let resetArmed = null;
$("reset").onclick = () => {
  const btn = $("reset");
  if (!resetArmed) {
    btn.textContent = "Tap again to erase sign progress";
    resetArmed = setTimeout(() => { resetArmed = null; btn.textContent = "Reset sign progress"; }, 4000);
    return;
  }
  clearTimeout(resetArmed); resetArmed = null;
  btn.textContent = "Reset sign progress";
  deck.reset();
  advance();
};

document.addEventListener("keydown", e => {
  if (e.target.closest && e.target.closest("button") && (e.key === " " || e.key === "Enter")) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === " " || e.key === "Enter") {
    if (current !== null) { e.preventDefault(); flip(); }
  } else if (revealed && "1234".includes(e.key)) {
    rate(["again", "hard", "good", "easy"][+e.key - 1]);
  } else if (e.key.toLowerCase() === "s") {
    speak();
  }
});

setInterval(() => { renderStats(); renderTable(); }, 30000);
current = deck.next();
render();
</script>
